name: CI

# Every gate is in tools/ci.py so it runs the same way locally and here.
# `--can-fail` proves each gate goes red when its subject is broken: a gate
# that cannot fail is decoration. The leak gate compares salted digests
# (tools/leak-hashes.json); only the salt is a secret, never the terms.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Shared tools' one dependency
        run: pip install pyyaml   # check_lang_parity.py reads docs/_config.yml; the skill's own scripts need nothing
      - name: All gates
        env:
          RONTGEN_LEAK_SALT: ${{ secrets.RONTGEN_LEAK_SALT }}   # a random salt; the terms never leave the machine
        run: python tools/ci.py
      - name: Each gate can fail
        run: python tools/ci.py --can-fail
